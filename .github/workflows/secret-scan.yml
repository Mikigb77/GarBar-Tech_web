name: Secret scan

# The repository is public: every commit, on every branch and PR, can be read by anyone.
# gitleaks scans the whole history of what this run checked out, so a key added in one commit
# and deleted in the next still fails the check.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history and the files
        # --redact keeps any secret it finds out of this public log.
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .
